<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#111315"/><rect width="390" height="56" fill="#191D20"/><text x="20" y="34" fill="#F4F1EA" font-family="Arial" font-size="14" font-weight="bold">AUDIOFACTORY / DIALOGUE</text><text x="18" y="91" fill="#7D8585" font-family="Arial" font-size="10">MULTI-SPEAKER PRODUCTION</text><text x="18" y="124" fill="#F4F1EA" font-family="Arial" font-size="23" font-weight="bold">Build the conversation.</text><rect x="16" y="148" width="358" height="84" rx="14" fill="#191D20" stroke="#343B40"/><circle cx="49" cy="190" r="20" fill="#343B40"/><text x="49" y="194" text-anchor="middle" fill="#E6A85C" font-family="Arial" font-size="13">A</text><text x="81" y="184" fill="#F4F1EA" font-family="Arial" font-size="12" font-weight="bold">Narrator</text><text x="81" y="202" fill="#7D8585" font-family="Arial" font-size="10">Warm Narrator · English US</text><rect x="16" y="244" width="358" height="84" rx="14" fill="#191D20" stroke="#343B40"/><circle cx="49" cy="286" r="20" fill="#343B40"/><text x="49" y="290" text-anchor="middle" fill="#E6A85C" font-family="Arial" font-size="13">B</text><text x="81" y="280" fill="#F4F1EA" font-family="Arial" font-size="12" font-weight="bold">Maya</text><text x="81" y="298" fill="#7D8585" font-family="Arial" font-size="10">Bright Conversational · English US</text><rect x="16" y="344" width="358" height="222" rx="14" fill="#191D20" stroke="#343B40"/><text x="32" y="372" fill="#F4F1EA" font-family="Arial" font-size="12" font-weight="bold">DIALOGUE SCRIPT</text><rect x="30" y="389" width="330" height="62" rx="9" fill="#22272B"/><text x="44" y="411" fill="#E6A85C" font-family="Arial" font-size="10">NARRATOR</text><text x="44" y="432" fill="#B2B7B5" font-family="Arial" font-size="11">The room fell silent...</text><rect x="30" y="462" width="330" height="82" rx="9" fill="#22272B"/><text x="44" y="484" fill="#E6A85C" font-family="Arial" font-size="1